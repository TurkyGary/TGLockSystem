Startup logs:
written in (.profile) location ($HOME/.profile)

-----

Power-ON/Power-OFF Buttons and RTC configurations
written in (/boot/firmware/config.txt)

-----

SystemON_LED_Indecator
- The script (systemON.py) is located in ($TGLOCKSYS/misc/scripts) folder
- The service (TGLockSystemON_indicator.service) is in (/etc/systemd/system)

-----

CardDetect
- The script (cardDetect.py) is located in ($TGLOCKSYS/misc/scripts) folder
- The service (TGLockSystem_cardDetect.service) is in (/etc/systemd/system)

-----

webUI
- The script (webRegister.py) is located in ($TGLOCKSYS/misc/webUI) folder
- the service (TGLockSystem_webUI.service) is in (/etc/systemd/system)

-----

** To start (*.service) use (sudo systemctl start <service name>)
** To stop (*.service) use (sudo systemctl stop <service name>)
** To enable (*.service) use (sudo systemctl enable <service name>)
** To disable (*.service) use (sudo systemctl disable <service name>)
